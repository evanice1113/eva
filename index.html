<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>探索您的命定咖啡香 - 精選莊園咖啡豆</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #fcf9f5;
            color: #3b2f2f;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <!-- 頂部導覽列 -->
    <header class="bg-white shadow-sm sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <span class="text-2xl font-bold tracking-wider text-[#6b4423]">☕ 命定咖啡香</span>
            </div>
            <!-- 購物車按鈕 -->
            <button onclick="toggleCart()" class="relative bg-[#6b4423] text-white px-4 py-2 rounded-lg flex items-center space-x-2 hover:bg-[#523319] transition">
                <span>🛒 購物車</span>
                <span id="cart-count" class="absolute -top-2 -right-2 bg-red-500 text-white text-xs w-6 h-6 rounded-full flex items-center justify-center font-bold">0</span>
            </button>
        </div>
    </header>

    <!-- 主內容區 -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12 flex-grow w-full">
        <!-- 標題區 -->
        <div class="text-center mb-10">
            <h1 class="text-3xl sm:text-4xl font-bold tracking-tight text-[#3b2f2f] mb-3">探索您的命定咖啡香</h1>
            <p class="text-gray-600 text-sm sm:text-base">嚴選產地莊園豆，職人精心烘焙，每一口都是極致享受。</p>
        </div>

        <!-- 商品分類按鈕 -->
        <div class="flex flex-wrap justify-center gap-3 mb-12" id="category-filters">
            <button onclick="filterCategory('all')" class="category-btn px-5 py-2 rounded-full text-sm font-medium transition bg-[#6b4423] text-white shadow-sm" data-category="all">全部商品</button>
            <button onclick="filterCategory('single')" class="category-btn px-5 py-2 rounded-full text-sm font-medium transition bg-white text-gray-700 hover:bg-gray-100 border border-gray-200" data-category="single">單品莊園豆</button>
            <button onclick="filterCategory('process')" class="category-btn px-5 py-2 rounded-full text-sm font-medium transition bg-white text-gray-700 hover:bg-gray-100 border border-gray-200" data-category="process">特殊處理法</button>
            <button onclick="filterCategory('blend')" class="category-btn px-5 py-2 rounded-full text-sm font-medium transition bg-white text-gray-700 hover:bg-gray-100 border border-gray-200" data-category="blend">經典配方豆</button>
        </div>

        <!-- 商品列表格 -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6" id="product-grid">
            <!-- 商品將由 JavaScript 動態生成 -->
        </div>
    </main>

    <!-- 購物車抽屜 / 結帳彈窗 -->
    <div id="cart-drawer" class="fixed inset-0 z-50 overflow-hidden hidden">
        <div class="absolute inset-0 bg-black bg-opacity-50 transition-opacity" onclick="toggleCart()"></div>
        <div class="absolute inset-y-0 right-0 max-w-full flex pl-10">
            <div class="w-screen max-w-md bg-white shadow-xl flex flex-col">
                <!-- 標題 -->
                <div class="flex items-center justify-between px-6 py-4 bg-[#6b4423] text-white">
                    <h2 class="text-lg font-bold">🛒 您的購物車明細</h2>
                    <button onclick="toggleCart()" class="text-white hover:text-gray-200 text-xl font-bold">&times;</button>
                </div>
                <!-- 購物車內容 -->
                <div class="flex-1 overflow-y-auto p-6 space-y-4" id="cart-items-container">
                    <!-- 購物車細目由 JS 帶入 -->
                </div>
                <!-- 底部總金額與結帳 -->
                <div class="border-t border-gray-200 px-6 py-4 bg-gray-50">
                    <div class="flex justify-between items-center mb-4 text-lg font-bold text-[#3b2f2f]">
                        <span>總金額：</span>
                        <span id="cart-total" class="text-red-600 text-xl">NT$ 0</span>
                    </div>
                    <button onclick="checkout()" class="w-full bg-[#6b4423] text-white py-3 rounded-lg font-medium hover:bg-[#523319] transition shadow-md">
                        前往結帳
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 頁尾 -->
    <footer class="bg-white border-t border-gray-200 py-6 text-center text-sm text-gray-500">
        <p>&copy; 2026 探索您的命定咖啡香 版權所有</p>
    </footer>

    <!-- JavaScript 互動邏輯 -->
    <script>
        // 商品資料庫 (已修正第二個商品的圖片來源)
        const products = [
            {
                id: 1,
                name: "衣索比亞 耶加雪菲 水洗 G1",
                category: "single",
                price: 450,
                desc: "帶有明亮的茉莉花香、檸檬皮與柑橘風味，口感清新滑順，酸質細緻高雅。...",
                img: "https://images.unsplash.com/photo-1514432324607-a09d9b4aefdd?auto=format&fit=crop&w=600&q=80"
            },
            {
                id: 2,
                name: "哥倫比亞 薇拉 雙重厭氧發酵",
                category: "process",
                price: 520,
                desc: "濃郁的熱帶水果香氣，帶有芒果、百香果與酒香尾韻，層次非常豐富飽滿。...",
                img: "https://images.unsplash.com/photo-1559056199-641a0ac8b55e?auto=format&fit=crop&w=600&q=80"
            },
            {
                id: 3,
                name: "瓜地馬拉 花神 莊園級中焙",
                category: "single",
                price: 420,
                desc: "經典平衡的堅果與可可風味，帶有一絲紅蘋果的微酸，口感溫潤醇厚，適合手沖或義式。...",
                img: "https://images.unsplash.com/photo-1587049352847-4a222e784d38?auto=format&fit=crop&w=600&q=80"
            },
            {
                id: 4,
                name: "曼特寧 蘇門答臘 黃金曼特寧",
                category: "blend",
                price: 480,
                desc: "醇厚度極高，低酸度。帶有濃郁的藥草、黑巧克力與焦糖香氣，回甘強烈持久。...",
                img: "https://images.unsplash.com/photo-1511920170033-f8396924c348?auto=format&fit=crop&w=600&q=80"
            }
        ];

        // 購物車資料結構
        let cart = {};

        // 初始化渲染商品
        function renderProducts(filter = 'all') {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = '';

            const filtered = filter === 'all' ? products : products.filter(p => p.category === filter);

            filtered.forEach(product => {
                const qty = cart[product.id] ? cart[product.id].quantity : 1;
                const card = document.createElement('div');
                card.className = "bg-white rounded-xl shadow-sm hover:shadow-md transition overflow-hidden flex flex-col justify-between border border-gray-100";
                card.innerHTML = `
                    <div>
                        <div class="h-48 overflow-hidden bg-gray-100">
                            <img src="${product.img}" alt="${product.name}" class="w-full h-full object-cover hover:scale-105 transition duration-300">
                        </div>
                        <div class="p-5">
                            <h3 class="font-bold text-lg text-[#3b2f2f] mb-2">${product.name}</h3>
                            <p class="text-red-600 font-bold text-lg mb-3">NT$ ${product.price}</p>
                            <p class="text-gray-600 text-xs line-clamp-3 mb-4">${product.desc}</p>
                        </div>
                    </div>
                    <div class="p-5 pt-0 flex flex-col space-y-3">
                        <!-- 數量調整器 -->
                        <div class="flex items-center justify-between bg-gray-50 px-3 py-1.5 rounded-lg border border-gray-200">
                            <span class="text-xs text-gray-500 font-medium">數量</span>
                            <div class="flex items-center space-x-3">
                                <button onclick="updateQty(${product.id}, -1)" class="w-7 h-7 bg-white rounded border border-gray-300 flex items-center justify-center text-gray-700 hover:bg-gray-100 font-bold">-</button>
                                <span id="qty-${product.id}" class="font-bold text-sm w-4 text-center">${qty}</span>
                                <button onclick="updateQty(${product.id}, 1)" class="w-7 h-7 bg-white rounded border border-gray-300 flex items-center justify-center text-gray-700 hover:bg-gray-100 font-bold">+</button>
                            </div>
                        </div>
                        <!-- 加入購物車按鈕 -->
                        <button onclick="addToCart(${product.id})" class="w-full bg-[#6b4423] text-white py-2.5 rounded-lg text-sm font-medium hover:bg-[#523319] transition shadow-sm">
                            加入購物車
                        </button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // 分類篩選切換
        function filterCategory(category) {
            document.querySelectorAll('.category-btn').forEach(btn => {
                if(btn.dataset.category === category) {
                    btn.className = "category-btn px-5 py-2 rounded-full text-sm font-medium transition bg-[#6b4423] text-white shadow-sm";
                } else {
                    btn.className = "category-btn px-5 py-2 rounded-full text-sm font-medium transition bg-white text-gray-700 hover:bg-gray-100 border border-gray-200";
                }
            });
            renderProducts(category);
        }

        // 調整商品卡片上的暫存數量
        function updateQty(productId, change) {
            if (!cart[productId]) {
                cart[productId] = { quantity: 1 };
            }
            cart[productId].quantity += change;
            if (cart[productId].quantity < 1) {
                cart[productId].quantity = 1;
            }
            const qtySpan = document.getElementById(`qty-${productId}`);
            if (qtySpan) {
                qtySpan.innerText = cart[productId].quantity;
            }
        }

        // 實際加入購物車
        function addToCart(productId) {
            const product = products.find(p => p.id === productId);
            const selectQty = cart[productId] ? cart[productId].quantity : 1;

            if (cart[productId] && cart[productId].name) {
                cart[productId].quantity = selectQty;
            } else {
                cart[productId] = {
                    ...product,
                    quantity: selectQty
                };
            }
            updateCartUI();
            toggleCart();
        }

        // 更新購物車總數與明細清單畫面
        function updateCartUI() {
            const container = document.getElementById('cart-items-container');
            const countBadge = document.getElementById('cart-count');
            const totalEl = document.getElementById('cart-total');
            
            container.innerHTML = '';
            let totalCount = 0;
            let totalPrice = 0;

            const cartKeys = Object.keys(cart).filter(id => cart[id].name);

            if (cartKeys.length === 0) {
                container.innerHTML = `<p class="text-center text-gray-400 py-12">您的購物車目前是空的</p>`;
                countBadge.innerText = '0';
                totalEl.innerText = 'NT$ 0';
                return;
            }

            cartKeys.forEach(id => {
                const item = cart[id];
                totalCount += item.quantity;
                totalPrice += item.price * item.quantity;

                const itemDiv = document.createElement('div');
                itemDiv.className = "flex items-center justify-between border-b border-gray-100 pb-4";
                itemDiv.innerHTML = `
                    <div class="flex-1 pr-4">
                        <h4 class="font-bold text-sm text-[#3b2f2f]">${item.name}</h4>
                        <p class="text-xs text-gray-500 mt-1">NT$ ${item.price} × ${item.quantity}</p>
                    </div>
                    <div class="text-right">
                        <span class="font-bold text-sm text-red-600">NT$ ${item.price * item.quantity}</span>
                        <button onclick="removeFromCart(${id})" class="block text-xs text-red-400 hover:text-red-600 mt-1 ml-auto">刪除</button>
                    </div>
                `;
                container.appendChild(itemDiv);
            });

            countBadge.innerText = totalCount;
            totalEl.innerText = `NT$ ${totalPrice}`;
        }

        // 從購物車移除項目
        function removeFromCart(productId) {
            delete cart[productId];
            updateCartUI();
            renderProducts();
        }

        // 開啟/關閉購物車抽屜
        function toggleCart() {
            const drawer = document.getElementById('cart-drawer');
            drawer.classList.toggle('hidden');
        }

        // 結帳動作
        function checkout() {
            const cartKeys = Object.keys(cart).filter(id => cart[id].name);
            if (cartKeys.length === 0) {
                alert('您的購物車是空的，請先選擇商品！');
                return;
            }
            alert('感謝您的訂購！系統將為您導向至結帳頁面。');
            cart = {};
            updateCartUI();
            toggleCart();
            renderProducts();
        }

        // 頁面載入時初始化
        renderProducts();
    </script>
</body>
</html>
